name: product-api-prod

services:
  mongodb:
    image: mongo:8
    container_name: product-api-mongodb-prod
    restart: unless-stopped
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    image: nghia1605/product-api:latest
    container_name: product-api-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://mongodb:27017/productdb"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongodb_prod_data:


name: product-api

services:
  nammongodb:
    image: mongo:latest
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  product-api:
    build: .
    image: product-api:1.0
    container_name: product-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://nammongodb:27017/productdb"
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); const req = http.get('http://127.0.0.1:3000/health', res => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => { req.destroy(); process.exit(1); });"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongodb_data:

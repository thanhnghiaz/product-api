```yaml
name: Product API CI CD Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval
          'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/product-api
      MONGODB_URI: mongodb://host.docker.internal:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Docker image
        run: docker build -t product-api:test .

      - name: Run container with healthcheck
        run: |
          docker run -d \
            --name product-api-test \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e PORT=3000 \
            -e MONGODB_URI="$MONGODB_URI" \
            --health-cmd="node -e \"require('http').get('http://127.0.0.1:3000/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            --health-start-period=20s \
            product-api:test

      - name: Wait for healthy container
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              product-api-test)

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs product-api-test
              exit 1
            fi

            sleep 2
          done

          docker logs product-api-test
          echo "Healthcheck timed out"
          exit 1

      - name: Verify API endpoint
        run: |
          curl --fail http://127.0.0.1:3000/health

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag product-api:test "$IMAGE_NAME:latest"
          docker tag product-api:test "$IMAGE_NAME:${GITHUB_SHA::7}"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA::7}"

      - name: Show logs if failed
        if: failure()
        run: docker logs product-api-test || true

      - name: Cleanup test container
        if: always()
        run: docker rm -f product-api-test || true
```

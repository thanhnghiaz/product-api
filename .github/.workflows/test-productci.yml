```yaml
name: Test Product CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test runner
        run: echo "GitHub Actions runner is working!"

      - name: Check repository
        run: |
          pwd
          ls -la

      - name: Check Docker
        run: docker --version

      - name: CI test passed
        run: echo "Product CI pipeline completed successfully!"
```
